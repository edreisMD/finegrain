name: finegrain
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gbrain
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/install-server.sh first}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gbrain -d gbrain"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  gbrain:
    image: finegrain:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: [brain]
    environment:
      GBRAIN_DATABASE_URL: postgresql://gbrain:${POSTGRES_PASSWORD}@postgres:5432/gbrain
      GBRAIN_ADMIN_BOOTSTRAP_TOKEN: ${GBRAIN_ADMIN_BOOTSTRAP_TOKEN:?Missing owner credential}
      GBRAIN_PUBLIC_URL: ${GBRAIN_PUBLIC_URL:-http://localhost:3131}
    volumes:
      - brain:/data
    ports:
      - "${FINEGRAIN_BIND:-127.0.0.1}:3131:3131"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:3131/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  trainer:
    image: finegrain:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: [trainer]
    environment:
      GBRAIN_DATABASE_URL: postgresql://gbrain:${POSTGRES_PASSWORD}@postgres:5432/gbrain
      GBRAIN_PUBLIC_URL: ${GBRAIN_PUBLIC_URL:-http://localhost:3131}
      RIVER_API_KEY: ${RIVER_API_KEY:-}
      FINEGRAIN_COMPANY: ${FINEGRAIN_COMPANY:-company}
      FINEGRAIN_CADENCE: ${FINEGRAIN_CADENCE:-nightly}
      FINEGRAIN_TIMEZONE: ${FINEGRAIN_TIMEZONE:-UTC}
      GM_CHECKPOINT: ${GM_CHECKPOINT:-}
      GM_NAME: ${GM_NAME:-gm-v1}
      GM_BASE_MODEL: ${GM_BASE_MODEL:-Qwen/Qwen3.5-9B}
      GM_LORA_RANK: ${GM_LORA_RANK:-16}
    volumes:
      - brain:/data
      - training:/training
    ports:
      - "${FINEGRAIN_BIND:-127.0.0.1}:8787:8787"
    depends_on:
      gbrain:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  brain:
  training:
