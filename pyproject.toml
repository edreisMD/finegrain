[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finegrain-memory"
version = "0.1.0"
description = "Turn company memory into grounded datasets, verifiable RL tasks, and a model that learns."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
river = ["river-client==0.11.0"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1"]

[project.scripts]
finegrain = "finegrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finegrain = ["data/*.jsonl", "web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
